name: e2e

on:
  workflow_run:
    workflows: ["Deploy to Demo"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: frontend/.nvmrc
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: eu-west-1
        role-to-assume: ${{ secrets.ACTION_E2E_TESTS_ROLE }}

    - name: Retrieve test user email and password
      uses: aws-actions/aws-secretsmanager-get-secrets@v4
      with:
        secret-ids: |
          e2e/test1
        parse-json-secrets: true

    - name: Retrieve PCUI URL from the demo stack
      run: |
        source infrastructure/environments/demo-variables.sh
        URL=$(aws cloudformation describe-stacks \
          --region "$REGION" \
          --stack-name "$STACK_NAME" \
          --query "Stacks[0].Outputs[?OutputKey=='ParallelClusterUIUrl'].OutputValue" \
          --output text)
        if [[ -z "$URL" || "$URL" == "None" ]]; then
          echo "::error::Output ParallelClusterUIUrl not found in stack $STACK_NAME ($REGION)"
          exit 1
        fi
        echo "PCUI URL: $URL"
        echo "E2E_TEST_URL=$URL" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: npm ci
      working-directory: e2e
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: e2e
    - name: Run Playwright tests
      run: npm run e2e:test
      working-directory: e2e
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: e2e/test-results/
        retention-days: 30
  # Publishes the outcome of the E2E tests as a CloudWatch metric, so that a
  # CloudWatch alarm can make failures visible.
  publish-metric:
    name: Publish E2E Outcome Metric
    needs: e2e-tests
    # A cancelled or skipped test run says nothing about the health of the branch: it must
    # publish no data point at all, so that the alarm keeps the state it already had.
    if: >-
      ${{ always()
      && (needs.e2e-tests.result == 'success'
      || needs.e2e-tests.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: eu-west-1
        role-to-assume: ${{ secrets.ACTION_E2E_TESTS_ROLE }}
        role-session-name: GitHub_${{ github.event.repository.name }}_E2EMetrics
    - name: Publish E2E Outcome Metric
      env:
        METRIC_VALUE: ${{ needs.e2e-tests.result == 'failure' && 1 || 0 }}
        GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GH_REF_NAME: ${{ github.ref_name }}
      run: |
        aws cloudwatch put-metric-data \
          --region eu-west-1 \
          --namespace ParallelCluster \
          --metric-name PCUIE2ETestFailure \
          --unit Count \
          --value "${METRIC_VALUE}" \
          --dimensions "Organization=${GH_REPOSITORY_OWNER},Branch=${GH_REF_NAME}"
      timeout-minutes: 5
